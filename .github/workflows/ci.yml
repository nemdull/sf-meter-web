name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint・テスト・ビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # 外部のアクションは、タグではなくコミットの番号で固定する
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      # package-lock.json のとおりに入れる（実行のたびに版が変わらないように）
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    name: コンテナ
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: ビルド
        run: docker build -t sf-meter-web:ci .
      - name: 起動して、画面が返ること
        run: |
          docker run -d --name web -p 8081:80 sf-meter-web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8081/ -o index.html; then break; fi
            sleep 1
          done
          grep -q "SF Meter" index.html
          # 深いパスを直接開いても、画面の入り口が返ること
          curl -fsS http://localhost:8081/some/deep/link | grep -q "SF Meter"
          # API が居ないときの /api は失敗で返る（画面は、これを見てサンプルデータに切り替える）
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:8081/api/v1/stats || true)"
          echo "API なしの /api の応答: $status"
          test "$status" != "200"
      - name: うまくいかなかったときの記録
        if: failure()
        run: docker logs web
